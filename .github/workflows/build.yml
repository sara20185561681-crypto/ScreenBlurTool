name: Build Windows EXE

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PySide6 pyinstaller

    - name: Build Executable
      run: |
        pyinstaller --noconfirm --onedir --windowed --exclude-module PySide6.QtQuick --exclude-module PySide6.QtQml --exclude-module PySide6.QtWebEngineCore app.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ScreenBlurTool-Windows
        path: dist/app